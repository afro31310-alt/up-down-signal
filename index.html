
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Up or Down</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#203324;font-family:Arial,sans-serif}
.game{
 width:100%;max-width:450px;min-height:100vh;margin:auto;
 padding:22px 18px 35px;text-align:center;color:#eee0c9;
 background:repeating-linear-gradient(0deg,#402719 0,#573521 18px,#29190f 20px,#63402a 39px);
 box-shadow:0 0 30px #0008;
}
.wheel{
 width:min(74vw,285px);height:min(74vw,285px);
 margin:0 auto;position:relative;border-radius:50%;
 border:9px solid #b87943;
 outline:2px solid #e2a56b;
 box-shadow:0 4px 0 #62371c,0 8px 18px #0008;
 overflow:hidden;
}
.up,.down{
 position:absolute;left:3%;width:94%;height:49%;
 display:flex;align-items:center;justify-content:center;
 font-size:38px;font-weight:900;color:#f3e4b9;
 text-shadow:0 2px 3px #60451c;
}
.up{top:2%;background:radial-gradient(#79b900,#4d8d00);border-radius:150px 150px 0 0}
.down{bottom:2%;background:radial-gradient(#ffb52c,#d68108);border-radius:0 0 150px 150px}
.line{position:absolute;top:49%;left:0;width:100%;height:5px;background:#f5dfbd;z-index:2}
.bottle-box{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.bottle{font-size:110px;transform:rotate(90deg);filter:drop-shadow(0 5px 3px #0009)}
.bottle.spin{animation:spin 3s cubic-bezier(.12,.72,.12,1) forwards}
@keyframes spin{from{transform:rotate(90deg)}to{transform:rotate(1890deg)}}
.note{font-size:14px;font-weight:bold;color:#d7c5ad;margin:18px 0 0;text-shadow:0 2px 3px #000}
#result{
 width:100%;height:120px;margin-top:108px;
 border:10px solid #cfc7ba;border-radius:20px;
 background:linear-gradient(#b17b2d,#8a5a20);
 box-shadow:inset 0 4px 10px #4a2a0e;
 color:#f6e5c9;font-size:42px;font-weight:900;
 cursor:pointer;
}
#result:disabled{opacity:.9}
#message{font-size:14px;color:#f0dfc4;margin-top:18px;min-height:20px}
</style>
</head>
<body>
<div class="game">
 <div class="wheel">
  <div class="up">UP</div>
  <div class="down">DOWN</div>
  <div class="line"></div>
  <div class="bottle-box">
   <div class="bottle" id="bottle">🍾</div>
  </div>
 </div>

 <div class="note">PASS 2X / Lose if bottle stops at MIDDLE</div>

 <button id="result">SPIN</button>
 <div id="message">Tap SPIN to start</div>
</div>

<script>
const bottle=document.getElementById("bottle");
const button=document.getElementById("result");
const message=document.getElementById("message");
let busy=false;

button.addEventListener("click",()=>{
 if(busy)return;
 busy=true;
 button.disabled=true;
 button.textContent="SPINNING...";
 message.textContent="Bottle is spinning...";

 bottle.classList.remove("spin");
 bottle.style.transform="rotate(90deg)";
 void bottle.offsetWidth;
 bottle.classList.add("spin");

 const outcome=Math.random()<0.5?"UP":"DOWN";

 setTimeout(()=>{
  bottle.classList.remove("spin");
  bottle.style.transform=outcome==="UP"?"rotate(0deg)":"rotate(180deg)";

  button.textContent=outcome;
  button.style.background=outcome==="UP"
   ?"linear-gradient(#70a91a,#467a08)"
   :"linear-gradient(#c0872c,#8a5a20)";

  message.textContent="Result: "+outcome;
  busy=false;
  button.disabled=false;
 },3000);
});
</script>
</body>
</html>
